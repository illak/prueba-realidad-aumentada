<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Realidad Aumentada</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
        }
        #overlay span {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 1.5rem;
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <span>Toca para iniciar la experiencia AR</span>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" vr-mode-ui="enabled: false">
        <a-assets>
            <video id="mivideo" src="video.mp4" crossorigin="anonymous" playsinline webkit-playsinline preload="auto"></video>
            <video id="mivideo2" src="video2.mp4" crossorigin="anonymous" playsinline webkit-playsinline preload="auto"></video>
        </a-assets>

        <a-marker id="video1" type="barcode" value="2">
            <a-video src="#mivideo" position="0 0 0" rotation="-90 0 0"></a-video>
        </a-marker>

        <a-marker id="video2" type="barcode" value="4">
            <a-video src="#mivideo2" position="0 0 0" rotation="-90 0 0"></a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var overlay = document.getElementById("overlay");
            var video1 = document.getElementById("mivideo");
            var video2 = document.getElementById("mivideo2");

            overlay.addEventListener("click", function () {
                [video1, video2].forEach(function (video) {
                    var playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.then(function () {
                            video.pause();
                            video.currentTime = 0;
                        }).catch(function (err) {
                            console.warn("Video unlock failed:", err);
                        });
                    }
                });
                overlay.style.display = "none";
            });

            function setupMarker(markerId, videoElement) {
                var marker = document.getElementById(markerId);
                if (!marker) {
                    console.warn("Marker not found:", markerId);
                    return;
                }

                marker.addEventListener("markerFound", function () {
                    var playPromise = videoElement.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(function (err) {
                            console.warn("Video play failed for " + markerId + ":", err);
                        });
                    }
                });

                marker.addEventListener("markerLost", function () {
                    videoElement.pause();
                });
            }

            setupMarker("video1", video1);
            setupMarker("video2", video2);
        });
    </script>
</body>
</html>
